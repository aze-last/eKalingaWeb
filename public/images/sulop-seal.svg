<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="190" fill="#0B132B" stroke="#F59E0B" stroke-width="6"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="200" r="162" fill="#1C2541" stroke="#F59E0B" stroke-width="4"/>

  <!-- Curved Text Path -->
  <path id="top-curve" d="M 50 200 A 150 150 0 0 1 350 200" fill="none" />
  <path id="bottom-curve" d="M 350 200 A 150 150 0 0 1 50 200" fill="none" />

  <text font-family="'Instrument Sans', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="3">
    <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
      MUNICIPALITY OF SULOP
    </textPath>
  </text>

  <text font-family="'Instrument Sans', 'Arial Black', sans-serif" font-size="14" font-weight="800" fill="#F59E0B" letter-spacing="2">
    <textPath href="#bottom-curve" startOffset="50%" text-anchor="middle">
      PROVINCE OF DAVAO DEL SUR • REGION XI
    </textPath>
  </text>

  <!-- Inner Crest Background -->
  <circle cx="200" cy="200" r="115" fill="#0F172A" stroke="#10B981" stroke-width="3"/>

  <!-- Year Badges -->
  <rect x="82" y="185" width="46" height="28" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="105" y="204" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">19</text>

  <rect x="272" y="185" width="46" height="28" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="295" y="204" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">58</text>

  <!-- Crest Graphics: Sun & Mountains & Fields -->
  <!-- Sun Rays -->
  <g fill="#F59E0B" opacity="0.9">
    <path d="M 200 115 L 204 130 L 196 130 Z"/>
    <path d="M 175 125 L 188 136 L 182 131 Z"/>
    <path d="M 225 125 L 218 131 L 212 136 Z"/>
    <circle cx="200" cy="148" r="18" fill="#F59E0B"/>
  </g>

  <!-- Mountain Peaks -->
  <polygon points="135,190 175,145 215,190" fill="#3A506B" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="185,190 225,140 265,190" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>

  <!-- Rice Crops & Agricultural Lattice -->
  <path d="M 140 190 Q 200 180 260 190 L 250 235 Q 200 245 150 235 Z" fill="#047857" stroke="#10B981" stroke-width="2"/>
  <line x1="160" y1="190" x2="165" y2="235" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="200" y1="185" x2="200" y2="240" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="240" y1="190" x2="235" y2="235" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Banner Ribbon for OFFICIAL SEAL -->
  <path d="M 130 255 L 270 255 L 260 275 L 200 278 L 140 275 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <text x="200" y="270" font-family="'Instrument Sans', sans-serif" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1.5">
    OFFICIAL SEAL
  </text>
</svg>
